<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>終身語言學習與檢定訓練系統</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1>🌍 終身外語學習與檢定訓練系統</h1>
        <p>內容自動更新，助你從初學順利通過檢定！</p>
        <!-- 語言選單動態生成位置 -->
        <div id="lang-menu" class="lang-menu"></div>
    </header>
    
    <main class="container">
        <!-- 內容渲染區 -->
        <div id="content-area">
            <div class="welcome-card">
                <h2>歡迎開始你的外語旅程 🚀</h2>
                <p>請點擊上方任一語言按鈕，系統將自動從雲端載入最新題庫與文章。</p>
            </div>
        </div>
    </main>

    <footer class="app-footer">
        <p>支援：TOEIC、JLPT、TOPIK、DELF、Goethe、DELE 系統 | 自動化雲端題庫驅動</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
