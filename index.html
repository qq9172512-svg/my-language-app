<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>語研大冒險 - Language Learning PWA</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <!-- Supabase JS Client (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="app">
    <!-- 頂部導覽列 -->
    <header class="top-bar">
      <div class="user-status">
        <span class="avatar">🐱</span>
        <div>
          <div class="user-name" id="user-name">自由冒險家</div>
          <div class="sync-tag" id="sync-indicator">👤 本地模式</div>
        </div>
      </div>
      <div class="stats-group">
        <div class="stat-badge">🔥 <span id="streak-val">1</span> 天</div>
        <div class="stat-badge">⭐ <span id="xp-val">0</span> XP</div>
        <button id="btn-logout" class="icon-btn" title="帳號 / 登入管理">⚙️</button>
      </div>
    </header>

    <!-- 主內容區域 -->
    <main class="content-area">
      <!-- Tab 1: 地圖關卡 -->
      <section id="tab-map" class="tab-page">
        <div class="lang-selector-wrapper">
          <label for="lang-select">選擇目標語言：</label>
          <select id="lang-select">
            <option value="ja">🇯🇵 日語 (JLPT)</option>
            <option value="ko">🇰🇷 韓語 (TOPIK)</option>
            <option value="en">🇺🇸 英語 (TOEIC)</option>
          </select>
        </div>
        <div class="map-container">
          <h2>🗺️ 語言學習地圖</h2>
          <div id="map-nodes-container" class="map-nodes"></div>
        </div>
      </section>

      <!-- Tab 2: 3D 單字卡 SRS 複習 -->
      <section id="tab-cards" class="tab-page hidden">
        <div class="cards-header">
          <h3>🎴 智慧單字卡 (SRS)</h3>
          <span class="pending-badge">待複習：<span id="srs-pending-count">0</span></span>
        </div>

        <div class="flashcard-container">
          <div class="flashcard" id="active-card">
            <!-- 正面 -->
            <div class="card-face card-front">
              <span class="card-tag" id="card-cat">日常基礎</span>
              <div class="card-main-word" id="card-word">Loading...</div>
              <div class="card-sub-reading" id="card-reading">...</div>
              <button class="audio-btn" id="btn-audio">🔊 聽發音</button>
              <p class="flip-hint">👆 點擊卡片翻面看釋義</p>
            </div>
            <!-- 背面 -->
            <div class="card-face card-back">
              <div class="card-meaning-title">中文釋義</div>
              <div class="card-meaning-text" id="card-meaning">...</div>
              <div class="example-box">
                <p id="card-ex-src" class="ex-src">...</p>
                <p id="card-ex-tgt" class="ex-tgt">...</p>
              </div>
            </div>
          </div>
        </div>

        <!-- SRS 評分按鈕列 -->
        <div class="srs-controls">
          <button class="srs-btn hard" onclick="handleSrsRating(1)">🔴 很難 (1天後)</button>
          <button class="srs-btn good" onclick="handleSrsRating(3)">🟡 尚可 (3天後)</button>
          <button class="srs-btn easy" onclick="handleSrsRating(5)">🟢 簡單 (7天後)</button>
        </div>
      </section>

      <!-- Tab 3: 連連看小遊戲 -->
      <section id="tab-game" class="tab-page hidden">
        <div class="game-header">
          <h3>🎮 單字連連看挑戰</h3>
          <p>配對正確的單字與中文釋義以獲得額外 XP！</p>
          <button id="btn-start-game" class="btn primary">開始全新一局</button>
        </div>
        <div id="game-board" class="game-grid hidden"></div>
      </section>

      <!-- Tab 4: 個人檔案與數據 -->
      <section id="tab-profile" class="tab-page hidden">
        <div class="profile-card">
          <div class="profile-header">
            <div class="big-avatar">🐱</div>
            <h2 id="prof-display-name">冒險家</h2>
            <p id="prof-email">未登入</p>
          </div>
          <div class="profile-stats">
            <div class="p-stat-item">
              <span class="p-label">累積經驗值</span>
              <span class="p-val" id="prof-xp">0 XP</span>
            </div>
            <div class="p-stat-item">
              <span class="p-label">連續學習天數</span>
              <span class="p-val" id="prof-streak">1 天</span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- 底部導覽 Tab 列 -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="map">
        <span class="nav-icon">🗺️</span>
        <span class="nav-label">地圖</span>
      </button>
      <button class="nav-btn" data-tab="cards">
        <span class="nav-icon">🎴</span>
        <span class="nav-label">單字卡</span>
      </button>
      <button class="nav-btn" data-tab="game">
        <span class="nav-icon">🎮</span>
        <span class="nav-label">遊戲</span>
      </button>
      <button class="nav-btn" data-tab="profile">
        <span class="nav-icon">👤</span>
        <span class="nav-label">我的</span>
      </button>
    </nav>

    <!-- 🔒 登入/註冊 Modal 彈窗 (預設隱藏 hidden) -->
    <div id="auth-modal" class="auth-overlay hidden">
      <div class="auth-card">
        <div class="auth-header">
          <span class="app-logo">🐱</span>
          <h2>雲端帳號同步</h2>
          <p>登入 Supabase 帳號可跨裝置同步學習進度與 SRS 記憶紀錄</p>
        </div>
        <div class="auth-body">
          <input type="email" id="auth-email" placeholder="請輸入 Email" />
          <input type="password" id="auth-pwd" placeholder="請輸入密碼" />
          <button id="btn-login" class="btn primary">登入 / 註冊帳號</button>
          <div class="divider"><span>或</span></div>
          <button id="btn-close-modal" class="btn secondary">關閉 (繼續自由體驗)</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
