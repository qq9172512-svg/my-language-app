<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>語研大冒險 - 語言學習 App</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="app">
    <!-- 頂部列 -->
    <header class="top-bar">
      <div class="user-status">
        <span class="avatar">🐱</span>
        <div>
          <div class="user-name" id="user-name">自由冒險家</div>
          <div class="sync-tag" id="sync-indicator">👤 本地模式</div>
        </div>
      </div>
      <div class="stats-group">
        <div class="stat-badge">🔥 <span id="streak-val">1</span> 天</div>
        <div class="stat-badge">⭐ <span id="xp-val">0</span> XP</div>
        <button id="btn-logout" class="icon-btn" title="帳號 / 登入">⚙️</button>
      </div>
    </header>

    <!-- 主頁面 -->
    <main class="content-area">
      <!-- Tab 1: 地圖關卡 -->
      <section id="tab-map" class="tab-page">
        <div class="lang-selector-wrapper">
          <label for="lang-select" style="font-weight:700; font-size:14px; color:#4a5568;">選擇學習語言：</label>
          <select id="lang-select">
            <option value="ja">🇯🇵 日語 (JLPT N5)</option>
            <option value="ko">🇰🇷 韓語 (TOPIK I)</option>
            <option value="en">🇺🇸 英語 (生活實用)</option>
            <option value="fr">🇫🇷 法語 (DELF A1)</option>
            <option value="de">🇩🇪 德語 (Goethe A1)</option>
            <option value="es">🇪🇸 西班牙語 (DELE A1)</option>
          </select>
        </div>
        <h2 class="section-title">🗺️ 冒險關卡地圖</h2>
        <div id="map-nodes-container" class="map-nodes"></div>
      </section>

      <!-- Tab 2: 3D 單字卡 -->
      <section id="tab-cards" class="tab-page hidden">
        <div class="cards-header">
          <h2 class="section-title" style="margin:0;">🎴 智慧單字卡</h2>
          <span class="pending-badge">剩餘：<span id="srs-pending-count">0</span> 個</span>
        </div>

        <div class="flashcard-container">
          <div class="flashcard" id="active-card">
            <!-- 正面 -->
            <div class="card-face card-front">
              <span class="card-tag" id="card-cat">日常</span>
              <div class="card-main-word" id="card-word">...</div>
              <div class="card-sub-reading" id="card-reading">...</div>
              <button class="audio-btn" id="btn-audio">🔊 點擊發音</button>
              <p class="flip-hint">👆 點擊卡片翻看釋義與例句</p>
            </div>
            <!-- 背面 -->
            <div class="card-face card-back">
              <div class="card-meaning-title">中文釋義</div>
              <div class="card-meaning-text" id="card-meaning">...</div>
              <div class="example-box">
                <p id="card-ex-src" class="ex-src">...</p>
                <p id="card-ex-tgt" class="ex-tgt">...</p>
              </div>
            </div>
          </div>
        </div>

        <!-- SRS 記憶評分按鈕 -->
        <div class="srs-controls">
          <button class="srs-btn hard" id="srs-btn-hard">🔴 有點難</button>
          <button class="srs-btn good" id="srs-btn-good">🟡 還記得</button>
          <button class="srs-btn easy" id="srs-btn-easy">🟢 超簡單</button>
        </div>
      </section>

      <!-- Tab 3: 趣味遊戲中心 -->
      <section id="tab-game" class="tab-page hidden">
        <h2 class="section-title">🎮 趣味遊戲中心</h2>
        
        <!-- 遊戲模式切換按鈕組 -->
        <div class="game-mode-selector">
          <button class="game-mode-btn active" id="mode-match-btn">🧩 單字連連看</button>
          <button class="game-mode-btn" id="mode-audio-btn">🎯 聽音辨字</button>
          <button class="game-mode-btn" id="mode-swipe-btn">⚡ 快速衝刺</button>
        </div>

        <!-- 1. 單字連連看 -->
        <div id="game-match-view" class="game-container">
          <p class="game-desc">將單字與對應中文點擊配對，賺取 15 XP！</p>
          <button id="btn-start-game" class="btn primary">開始連連看</button>
          <div id="game-board" class="game-grid hidden"></div>
        </div>

        <!-- 2. 聽音辨字 -->
        <div id="game-audio-view" class="game-container hidden">
          <p class="game-desc">點擊發音按鈕聽語音，選出正確的中文解釋！</p>
          <div class="audio-quiz-card">
            <button id="btn-play-quiz-sound" class="big-audio-btn">🔊 點擊播放發音</button>
            <div id="audio-options-container" class="options-grid"></div>
          </div>
        </div>

        <!-- 3. 快速滑卡判斷 -->
        <div id="game-swipe-view" class="game-container hidden">
          <p class="game-desc">快速判斷顯示的單字與中文釋義是否完全匹配！</p>
          <div class="swipe-quiz-card">
            <div id="swipe-word" class="swipe-word">Loading...</div>
            <div id="swipe-meaning" class="swipe-meaning">...</div>
            <div class="swipe-btn-group">
              <button id="btn-swipe-false" class="swipe-action-btn btn-wrong">❌ 錯誤</button>
              <button id="btn-swipe-true" class="swipe-action-btn btn-correct">⭕ 正確</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Tab 4: 個人檔案 -->
      <section id="tab-profile" class="tab-page hidden">
        <h2 class="section-title">👤 冒險家成就</h2>
        <div style="background:#fff; padding:20px; border-radius:20px; border:2px solid #e2e8f0; text-align:center;">
          <div style="font-size:48px;">🐱</div>
          <h3 id="prof-display-name" style="margin-top:8px;">自由冒險家</h3>
          <p id="prof-email" style="font-size:12px; color:#a0aec0;">本地免登入模式</p>
          <div style="display:flex; justify-content:space-around; margin-top:20px; border-top:1px solid #edf2f7; padding-top:16px;">
            <div>
              <div style="font-size:12px; color:#a0aec0;">累積 XP</div>
              <div id="prof-xp" style="font-size:20px; font-weight:800; color:#38a169;">0 XP</div>
            </div>
            <div>
              <div style="font-size:12px; color:#a0aec0;">連續天數</div>
              <div id="prof-streak" style="font-size:20px; font-weight:800; color:#dd6b20;">1 天</div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- 底部導覽列 -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="map">
        <span class="nav-icon">🗺️</span>
        <span class="nav-label">關卡</span>
      </button>
      <button class="nav-btn" data-tab="cards">
        <span class="nav-icon">🎴</span>
        <span class="nav-label">單字卡</span>
      </button>
      <button class="nav-btn" data-tab="game">
        <span class="nav-icon">🎮</span>
        <span class="nav-label">遊戲</span>
      </button>
      <button class="nav-btn" data-tab="profile">
        <span class="nav-icon">👤</span>
        <span class="nav-label">我的</span>
      </button>
    </nav>

    <!-- 🔒 帳號登入 Modal (預設隱藏 hidden) -->
    <div id="auth-modal" class="auth-overlay hidden">
      <div class="auth-card">
        <span style="font-size:40px;">🐱</span>
        <h2>雲端同步帳號</h2>
        <p>登入可保存學習進度與經驗值</p>
        <div class="auth-body">
          <input type="email" id="auth-email" placeholder="請輸入 Email" />
          <input type="password" id="auth-pwd" placeholder="請輸入密碼" />
          <button id="btn-login" class="btn primary">登入 / 註冊</button>
          <div class="divider">或</div>
          <button id="btn-close-modal" class="btn secondary">繼續自由使用</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
